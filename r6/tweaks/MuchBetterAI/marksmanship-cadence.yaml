MBAI.BandClose:
  $type: gamedataAIActionCondition_Record
  spatialAND:
    - Condition.TargetBelow15m

MBAI.BandFar:
  $type: gamedataAIActionCondition_Record
  spatialAND:
    - Condition.TargetAbove12m

MBAI.Windup_$(tier):
  $instances:
    - { tier: TrashWeak, secs: 0.7 }
    - { tier: Normal, secs: 0.5 }
    - { tier: Rare, secs: 0.35 }
    - { tier: Officer, secs: 0.15 }
    - { tier: Elite, secs: 0.1 }
  $type: gamedataAIPatternDelay_Record
  shotNumber: 0
  delay: $(secs)

MBAI.BurstGap_$(tier)_$(slot):
  $instances:
    - { tier: TrashWeak, slot: a, shot: 7, secs: 0.9 }
    - { tier: TrashWeak, slot: b, shot: 15, secs: 0.9 }
    - { tier: Normal, slot: a, shot: 6, secs: 0.7 }
    - { tier: Normal, slot: b, shot: 12, secs: 0.7 }
    - { tier: Rare, slot: a, shot: 5, secs: 0.5 }
    - { tier: Rare, slot: b, shot: 10, secs: 0.5 }
    - { tier: Officer, slot: a, shot: 5, secs: 0.4 }
    - { tier: Officer, slot: b, shot: 10, secs: 0.4 }
    - { tier: Elite, slot: a, shot: 4, secs: 0.3 }
    - { tier: Elite, slot: b, shot: 8, secs: 0.3 }
  $type: gamedataAIPatternDelay_Record
  shotNumber: $(shot)
  delay: $(secs)

MBAI.BurstClose_TrashWeak:
  $type: gamedataAIPattern_Record
  activationConditions:
    - MBAI.BandClose
  patternSize: 15
  delays:
    - MBAI.Windup_TrashWeak
    - MBAI.BurstGap_TrashWeak_a
    - MBAI.BurstGap_TrashWeak_b

