# Darth Vader's Lightsaber (Star Wars Battlefront II) for Cyberpunk 2077
# Melee weapon based on the vanilla katana (moveset, blocking, bullet deflection with the right perk).
# Hilt model and textures from SWBF2, glowing red blade (mod\saber\meshes\saber.mesh).

# --- Model part ---------------------------------------------------------------
# Appearance names are mapped to .app files by mod\saber\saber_factory.csv (Saber_DarthVader.archive.xl).
Items.Saber_Vader_Grip:
  $base: Items.w_katana_grip
  appearanceResourceName: saber_vader_grip

# --- The lightsaber -----------------------------------------------------------
Items.Saber_DarthVader_TriggerDismembermentChance:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.TriggerDismembermentChance
  value: 0.40

Items.Saber_DarthVader_HitDismembermentFactor:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.HitDismembermentFactor
  value: 1.50

Items.Saber_DarthVader_TriggerWoundedChance:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.TriggerWoundedChance
  value: 0.40

Items.Saber_DarthVader_HitWoundsFactor:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.HitWoundsFactor
  value: 1.50

Items.Saber_DarthVader_CanWeaponIgnoreArmor:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.CanWeaponIgnoreArmor
  value: 1.00

Items.Saber_DarthVader_CanDealFullDamageToArmored:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.CanDealFullDamageToArmored
  value: 1.00

Items.Saber_DarthVader_Dismemberment_Stats:
  $type: gamedataStatModifierGroup_Record
  drawBasedOnStatType: False
  optimiseCombinedModifiers: False
  saveBasedOnStatType: False
  statModsLimit: -1
  relatedModifierGroups: []
  statModifiers:
    - Items.Saber_DarthVader_TriggerDismembermentChance
    - Items.Saber_DarthVader_HitDismembermentFactor
    - Items.Saber_DarthVader_TriggerWoundedChance
    - Items.Saber_DarthVader_HitWoundsFactor
    - Items.Saber_DarthVader_CanWeaponIgnoreArmor
    - Items.Saber_DarthVader_CanDealFullDamageToArmored

Items.Saber_DarthVader:
  $base: Items.Preset_Katana_Default
  displayName: l"Saber-Vader-Name"
  localizedDescription: l"Saber-Vader-Desc"
  quality: Quality.IconicItem
  appearanceResourceName: Saber_Vader_Default
  # The SWBF2 Audioware event bank owns this weapon's audio; avoid katana bleed-through.
  audioWeaponConfiguration: saber_silent
  visualTags: [ Default ]                   # fixed tag, so the inventory icon name below is known
  tags:
    - !append-once IconicWeapon
  statModifierGroups:
    - !remove Items.QualityRandomization
    - !append-once Items.IconicQualityRandomization
    - !append-once Items.Saber_DarthVader_Dismemberment_Stats
  hudIcon: UIIcon.Saber_Vader_HUD
  CraftingData: Items.Saber_DarthVader_CraftingPackage
  slotPartListPreset:
    - { $type: SlotItemPartPreset, slot: AttachmentSlots.Grip, itemPartPreset: Items.Saber_Vader_Grip }
  slotPartList:
    - $type: SlotItemPartListElement
      slot: AttachmentSlots.Grip
      itemPartList: [ { $type: ItemPartListElement, item: Items.Saber_Vader_Grip } ]

# --- Icons --------------------------------------------------------------------
# Inventory: the game looks up UIIcon.weapon_<appearanceResourceName>_None__<visualTag>
UIIcon.weapon_Saber_Vader_Default_None__Default:
  $type: UIIcon
  atlasResourcePath: mod\saber\icons\saber_icon.inkatlas
  atlasPartName: saber

# HUD (weapon outline in the weapon display)
UIIcon.Saber_Vader_HUD:
  $type: UIIcon
  atlasResourcePath: mod\saber\icons\saber_icon.inkatlas
  atlasPartName: saber_hud

# --- Where to buy -------------------------------------------------------------
# Always in stock at the gun shop in Little China, Watson
Vendors.Saber_Vader_VendorItem:
  $type: VendorItem
  item: Items.Saber_DarthVader
  quantity: [ Vendors.Always_Present ]

Vendors.wat_lch_gunsmith_01.itemStock:
  - !append-once Vendors.Saber_Vader_VendorItem
  - !append-once Vendors.Saber_DarthVader_RecipeVendorItem

# --- Crafting ---------------------------------------------------------------
Items.Saber_DarthVader_CraftingPackage:
  $type: gamedataCraftingPackage_Record
  craftingExpModifier: 1.0
  overcraftPenaltyModifier: 1.0
  craftingRecipe:
    - $type: gamedataRecipeElement_Record
      ingredient: Items.LegendaryMaterial1
      amount: 10
    - $type: gamedataRecipeElement_Record
      ingredient: Items.EpicMaterial1
      amount: 10

Items.Recipe_Saber_DarthVader:
  $type: gamedataItemRecipe_Record
  displayName: l"Saber-Vader-Name"
  craftingResult:
    $type: gamedataCraftingResult_Record
    item: Items.Saber_DarthVader
    amount: 1

Vendors.Saber_DarthVader_RecipeVendorItem:
  $type: VendorItem
  item: Items.Recipe_Saber_DarthVader
  quantity: [ Vendors.Always_Present ]
