BlackChrome.AuxiliaryCyberdeck$(tier):
  $instances:
    - { tier: Common, nextTier: BlackChrome.AuxiliaryCyberdeckCommonPlus, traceTime: 50, traceTimeV: -0.5,  name: blackchrome_auxCyberdeck_name1 }
    - { tier: CommonPlus, nextTier: BlackChrome.AuxiliaryCyberdeckUncommon, traceTime: 48, traceTimeV: -0.48, name: blackchrome_auxCyberdeck_name1 }
    - { tier: Uncommon, nextTier: BlackChrome.AuxiliaryCyberdeckUncommonPlus, traceTime: 43, traceTimeV: -0.43, name: blackchrome_auxCyberdeck_name2 }
    - { tier: UncommonPlus, nextTier: BlackChrome.AuxiliaryCyberdeckRare, traceTime: 40, traceTimeV: -0.40, name: blackchrome_auxCyberdeck_name2 }
    - { tier: Rare, nextTier: BlackChrome.AuxiliaryCyberdeckRarePlus, traceTime: 35, traceTimeV: -0.35, name: blackchrome_auxCyberdeck_name3 }
    - { tier: RarePlus, nextTier: BlackChrome.AuxiliaryCyberdeckEpic, traceTime: 32, traceTimeV: -0.32, name: blackchrome_auxCyberdeck_name3 }
    - { tier: Epic, nextTier: BlackChrome.AuxiliaryCyberdeckEpicPlus, traceTime: 28, traceTimeV: -0.28, name: blackchrome_auxCyberdeck_name4 }
    - { tier: EpicPlus, nextTier: BlackChrome.AuxiliaryCyberdeckLegendary, traceTime: 25, traceTimeV: -0.25, name: blackchrome_auxCyberdeck_name4 }
    - { tier: Legendary, nextTier: BlackChrome.AuxiliaryCyberdeckLegendaryPlus, traceTime: 20, traceTimeV: -0.2, name: blackchrome_auxCyberdeck_name5 }
    - { tier: LegendaryPlus, nextTier: BlackChrome.AuxiliaryCyberdeckLegendaryPlusPlus, traceTime: 18, traceTimeV: -0.18, name: blackchrome_auxCyberdeck_name5 }   
    - { tier: LegendaryPlusPlus, nextTier: None, traceTime: 15, traceTimeV: -0.15, name: blackchrome_auxCyberdeck_name5 }   
  $base: Items.AdvancedMilitechParalineMKVLegendary
  quality: Quality.$(tier)
  icon:
    atlasResourcePath: phoenicia\blackchrome\icons\preview_icons.inkatlas
    atlasPartName: slot_05
  nextUpgradeItem: $(nextTier)
  equipArea: EquipmentArea.FrontalCortexCW
  displayName: LocKey#$(name)
  tags: ['Cyberware', 'HideInBackpackUI', 'BlackChrome.AuxCyberdeck', 'Cyberdeck']
  blueprint: Items.Cyberware
  variants: [Variants.Humanity14Cost]
  OnEquip: 
    - Items.BaseDeck_inline0
    - Items.BaseDeck_inline3 
    - $type: GameplayLogicPackage
      effectors: 
        - $type: ApplyStatGroupEffector
          applicationTarget: Player
          effectorClassName: ApplyStatGroupEffector
          removeWithEffector: true
          prereqRecord: BlackChrome.RealCyberdeckPrereq
          statGroup: 
            $type: StatModifierGroup
            statModsLimit: -1
            statModifiers: 
              - $type: ConstantStatModifier
                modifierType: Additive
                statType: BaseStats.Memory
                value: -2
              - $type: ConstantStatModifier
                modifierType: Additive
                statType: BaseStats.BufferSize
                value: -3   
        - $type: ApplyStatGroupEffector
          applicationTarget: Player
          effectorClassName: ApplyStatGroupEffector
          removeWithEffector: true
          prereqRecord: BlackChrome.NoRealCyberdeckPrereq
          statGroup: 
            $type: StatModifierGroup
            statModsLimit: -1
            statModifiers: 
              - $type: ConstantStatModifier
                modifierType: AdditiveMultiplier
                statType: BaseStats.HackRevealPositionModifier
                value: $(traceTimeV)
              - $type: ConstantStatModifier
                modifierType: Additive
                statType: BaseStats.DeviceMemoryCostReduction
                value: 1
    - $type: GameplayLogicPackage
      UIData: 
        $type: GameplayLogicPackageUIData
        floatValues: [1]
        localizedDescription: LocKey#blackchrome_auxCyberdeck_description3    
    - $type: GameplayLogicPackage
      UIData: 
        $type: GameplayLogicPackageUIData
        floatValues: [$(traceTime)]
        localizedDescription: LocKey#blackchrome_auxCyberdeck_description1
    - $type: GameplayLogicPackage
      UIData: 
        $type: GameplayLogicPackageUIData
        floatValues: []
        localizedDescription: LocKey#blackchrome_auxCyberdeck_description4
    - $type: GameplayLogicPackage
      stats: 
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.Memory
          value: 2
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.BufferSize
          value: 3
        - $type: ConstantStatModifier
          modifierType: Additive
          statType: BaseStats.HasAuxCyberdeck
          value: 1
    

