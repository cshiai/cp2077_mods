# --- NCPD ---

# ARCH V4 FYRN (Blue)
Passengers.DetectiveDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__ncpd_inspector_melee1_baton_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__ncpd_inspector_ranged1_lexington_ma
      weight: 1
  validSlotNames: [seat_front_left]

