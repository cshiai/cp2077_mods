# --- Utility Vehicles ---

# ORANJE3 TABLE TOP ORANJE
Passengers.TraumaDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_ranged2_dian_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_shotgun2_zhuo_ma_rare
      weight: 1
  validSlotNames: [seat_front_left]

Passengers.TraumaPassengerFrontEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Passenger
  characterRecords: 
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_ranged2_dian_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_shotgun2_zhuo_ma_rare
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_rare_officer_chao_ma
      weight: 1
  validSlotNames: [seat_front_right]

Passengers.TraumaPassengerBackEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Passenger
  characterRecords: 
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_ranged2_dian_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.fe__trauma_soldier_shotgun2_zhuo_ma_rare
      weight: 1
  validSlotNames: [seat_back_left, seat_back_right]


