  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__scavenger_grunt1_ranged1_pulsar_ma
      weight: 1
