      character: Character.ncto__scavenger_grunt1_ranged1_slaughtomatic_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__scavenger_grunt1_ranged1_pulsar_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__scavenger_grunt1_ranged1_nova_wa
      weight: 1
