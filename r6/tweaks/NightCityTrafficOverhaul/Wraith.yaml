# DRIVERS
Passengers.WraithDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.wraiths_grunt1_melee1_ironpipe_ma
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.wraiths_grunt1_melee1_ironpipe_wa
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.wraiths_grunt1_melee1_tireiron_ma
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.wraiths_grunt1_melee1_tireiron_wa
    #   weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__wraiths_grunt1_ranged1_nova_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__wraiths_grunt1_ranged1_nova_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__wraiths_grunt1_ranged1_pulsar_ma
      weight: 1
