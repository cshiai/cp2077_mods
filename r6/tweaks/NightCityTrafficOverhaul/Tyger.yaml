      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_nue_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster2_ranged2_copperhead_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster2_ranged2_copperhead_wa
      weight: 1
  validSlotNames: [seat_front_right]

# RANDOM BACK PASSENGERS

Passengers.TygerPassengerBackEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 0.5
  role: Passenger
  characterRecords: 
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster2_ranged2_shingen_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
