# BIKER
Passengers.TygerBikerDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.ncto__tyger_claws_biker1_ranged1_nue_ma
    #   weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker1_ranged1_nue_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker1_ranged1_saratoga_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker1_ranged1_saratoga_wa
      weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.tyger_claws_biker2_ranged2_copperhead_ma
    #   weight: 0.5
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker2_ranged2_copperhead_wa
      weight: 0.5
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker2_ranged2_shingen_ma
      weight: 0.5
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker2_ranged2_shingen_wa
      weight: 0.5
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker3_shotgun2_tactician_wa
      weight: 0.2
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_biker3_shotgun3_zhuo_ma_elite
      weight: 0.2
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_officerbiker_officer_nue_ma
      weight: 0.05
  validSlotNames: [seat_front_left]

# DRIVERS
Passengers.TygerDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_copperhead_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_copperhead_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_nue_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_nue_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster2_ranged2_copperhead_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster2_ranged2_copperhead_wa
      weight: 1
  validSlotNames: [seat_front_left]

# RANDOM FRONT PASSENGERS

Passengers.TygerPassengerFrontEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1.0
  role: Passenger
  characterRecords: 
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__tyger_claws_gangster1_ranged1_copperhead_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
