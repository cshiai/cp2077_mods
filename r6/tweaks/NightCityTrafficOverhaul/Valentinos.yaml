# DRIVERS
Passengers.ValentinosDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.valentinos_grunt2_melee2_knife_ma
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.valentinos_grunt2_melee2_knife_wa
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.valentinos_grunt2_melee2_machete_ma
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.valentinos_grunt2_melee2_machete_wa
    #   weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_ajax_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_ajax_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_nue_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_nue_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_overture_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__valentinos_grunt2_ranged2_overture_wa
      weight: 1
  validSlotNames:
    - seat_front_left

