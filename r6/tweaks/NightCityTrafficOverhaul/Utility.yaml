# MEDICAL - DRIVER
Passengers.MedicalVanDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.MedicalFemale
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.MedicalMale
      weight: 1
  validSlotNames: [seat_front_left]

# MEDICAL - PASSENGER
Passengers.MedicalVanPassengerEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 0.5
  role: Passenger
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.MedicalFemale
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.MedicalMale
      weight: 1
  validSlotNames: [seat_front_right]