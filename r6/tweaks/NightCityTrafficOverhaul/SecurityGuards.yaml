      character: Character.ncto__hil_security_security2_ranged2_ajax_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__hil_security_security2_ranged2_saratoga_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__hil_security_security2_ranged2_saratoga_wa
