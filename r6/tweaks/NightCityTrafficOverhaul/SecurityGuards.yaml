# CHARTER HILL
Passengers.CharterHillDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__hil_security_grunt1_melee1_baton_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__hil_security_guard1_ranged1_nue_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__hil_security_guard1_ranged1_saratoga_ma
      weight: 1
