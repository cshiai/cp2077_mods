# BIKE
Passengers.policeBikerDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.NCTO_biker_handgun_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.NCTO_biker_rifle_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.NCTO_biker_shotgun_ma
      weight: 1
  validSlotNames: [seat_front_left]

