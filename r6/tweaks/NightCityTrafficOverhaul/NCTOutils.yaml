# TEST




# FOR PANIC DRIVING
Crowds.NCTO_PanicDrivingSlow:
  $base: Crowds.DrivingSlow
  acceleration: 2.0
  brakePressureFactor: 15.0
  deceleration: 14.0
  maxSpeed: 25.0


# APPEND MODDED LIST PLACEHOLDER VEHICLE
Vehicle.vehicle_list.list:
  - !append Vehicle.NCTO_porsche_911turbo_cabrio


# SECURITY FLEE ATTITUDE
ReactionPresets.Driver_Panic:
  $base: ReactionPresets.InVehicle_Civilian
  rules:
    - $base: ReactionPresets.Civilian_Neutral_inline0
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline1
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline2
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline3
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline4
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline5
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline6
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline7
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline8
      output: ReactionOutput.Panic
    - $base: ReactionPresets.Civilian_Neutral_inline9
      output: ReactionOutput.Panic


# VEHICLES HEALTH
VehicleStatPreset.VehicleHealthx20:
  $type: StatModifierGroup
  statModifiers:
    - $type: ConstantStatModifier
      modifierType: Multiplier
      statType: BaseStats.Health
      value: 2.0

VehicleStatPreset.VehicleHealthx30:
  $type: StatModifierGroup
  statModifiers:
    - $type: ConstantStatModifier
      modifierType: Multiplier
      statType: BaseStats.Health
      value: 3.0


