# FOR BIKE SPEEDS
Crowds.Bike_Sport_Driving:
  $base: Crowds.Car_Sport_Driving

Crowds.Bike__Sport_DrivingPattern:
  $type: gamedataCrowdSlotMovementPatternBase_Record
  name: normal
  settings: Crowds.Bike_Sport_Driving

Crowds.Sportbike_DrivingPackage:
  $type: gamedataCrowdSettingsPackageBase_Record
  specs:
    - Crowds.Bike__Sport_DrivingPattern
    - Crowds.StopDrivingPattern
    - Crowds.PanicDrivingPattern


