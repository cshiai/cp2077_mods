# DRIVERS
Passengers.MoxDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.the_mox_1_melee2_baseball_wa
    #   weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__the_mox_1_ranged1_lexington_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__the_mox_1_ranged1_pulsar_wa
      weight: 1
  validSlotNames: [seat_front_left]

# RANDOM FRONT PASSENGERS

Passengers.MoxPassengerFrontEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 0.75
  role: Passenger
  characterRecords: 
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__the_mox_1_ranged1_lexington_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__the_mox_1_ranged1_pulsar_wa
      weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.the_mox_1_melee2_baseball_wa
    #   weight: 1
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.the_mox_elite2_fmelee2_knife_wa_rare
    #   weight: 0.5
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.the_mox_elite2_fmelee2_machete_wa_rare
