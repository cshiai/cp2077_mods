# DRIVERS
Passengers.SixthstreetDriverEntry:
  $type: gamedataRandomPassengerEntry_Record
  probability: 1
  role: Driver
  characterRecords:
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_hooligan_ranged1_nova_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_hooligan_ranged1_nova_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_hooligan_ranged1_saratoga_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_hooligan_ranged1_saratoga_wa
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_menace1_shotgun2_igla_ma
      weight: 0.2
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_menace1_shotgun2_tactician_ma
      weight: 0.2
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__sixthstreet_veteran3_ranged2_ajax_ma
      weight: 0.2
  validSlotNames: [seat_front_left]

