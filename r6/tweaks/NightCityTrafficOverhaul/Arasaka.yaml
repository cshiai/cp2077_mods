  probability: 1
  role: Driver
  characterRecords:
    # - $type: gamedataWeightedCharacter_Record
    #   character: Character.arasaka_ranger1_melee2_knife_ma
    #   weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__arasaka_ranger1_ranged2_masamune_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__arasaka_ranger1_ranged2_shingen_ma
      weight: 1
    - $type: gamedataWeightedCharacter_Record
      character: Character.ncto__arasaka_ranger1_ranged2_shingen_wa
      weight: 1
  validSlotNames: [seat_front_left]


